<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailer da Mãe - Cardápio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 max-w-md mx-auto pb-32">

    <header class="text-center mb-8 mt-4">
        <h1 class="text-3xl font-extrabold text-orange-600">Trailer de Lanches</h1>
        <p class="text-slate-400 text-sm mt-1">Faça seu pedido abaixo</p>
    </header>

    <main id="cardapio-container" class="space-y-4"></main>

    <!-- Área do Carrinho de Compras fixada no fundo da tela -->
    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 p-4 shadow-xl flex justify-between items-center">
        <div>
            <p class="text-xs text-slate-400">Total do pedido:</p>
            <p class="text-xl font-extrabold text-slate-900" id="total-carrinho">R$ 0,00</p>
        </div>
        <div class="flex gap-2">
            <!-- Botão para limpar/zerar o pedido -->
            <button onclick="limparCarrinho()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 px-4 rounded-2xl transition-all text-sm">
                Limpar
            </button>
            <!-- Botão para finalizar -->
            <button onclick="enviarPedido()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-5 rounded-2xl shadow-lg shadow-purple-600/30 transition-all text-sm">
                Finalizar Pedido
            </button>
        </div>
    </div>

    <script>
        let total = 0;
        let adicionaisDisponiveis = []; // lista de adicionais vinda do banco

        // Busca os adicionais e o cardápio, depois monta a tela
        async function iniciar() {
            try {
                const respostaAdicionais = await fetch('http://localhost:3000/api/adicionais');
                adicionaisDisponiveis = await respostaAdicionais.json();
            } catch (erro) {
                console.error("Erro ao buscar adicionais:", erro);
                adicionaisDisponiveis = [];
            }
            carregarCardapio();
        }

        async function carregarCardapio() {
            try {
                const resposta = await fetch('http://localhost:3000/api/produtos');
                const produtos = await resposta.json();

                const container = document.getElementById('cardapio-container');
                container.innerHTML = '';

                // Separa lanches e bebidas em seções diferentes
                const lanches = produtos.filter(p => (p.categoria || 'lanche') === 'lanche');
                const bebidas = produtos.filter(p => p.categoria === 'bebida');

                if (lanches.length > 0) {
                    container.innerHTML += `<h2 class="text-lg font-bold text-slate-700 mt-2">Lanches</h2>`;
                    lanches.forEach(produto => container.innerHTML += criarCardProduto(produto));
                }

                if (bebidas.length > 0) {
                    container.innerHTML += `<h2 class="text-lg font-bold text-slate-700 mt-6">Bebidas</h2>`;
                    bebidas.forEach(produto => container.innerHTML += criarCardProduto(produto));
                }
            } catch (erro) {
                console.error("Erro ao buscar cardápio:", erro);
            }
        }

        // Monta o HTML de um produto, incluindo os checkboxes de adicionais (só para lanches)
        function criarCardProduto(produto) {
            const ehLanche = (produto.categoria || 'lanche') === 'lanche';
            const idUnico = `produto-${produto.id}`;

            let checkboxesHtml = '';
            if (ehLanche && adicionaisDisponiveis.length > 0) {
                checkboxesHtml = adicionaisDisponiveis.map(adicional => `
                    <label class="flex items-center justify-between text-sm text-slate-600 py-1.5 border-b border-slate-50 last:border-b-0">
                        <span class="flex items-center gap-2">
                            <input type="checkbox" class="checkbox-adicional accent-purple-600 w-4 h-4" data-preco="${adicional.preco}">
                            ${adicional.nome}
                        </span>
                        <span class="text-slate-400">+ R$ ${adicional.preco.toFixed(2).replace('.', ',')}</span>
                    </label>
                `).join('');
            }

            return `
                <div id="${idUnico}" class="bg-white p-5 rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 transition-all duration-300 hover:shadow-2xl hover:border-purple-100">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800">${produto.nome}</h2>
                            <p class="text-sm text-slate-400 mt-0.5">${produto.descricao}</p>
                            <p class="text-purple-600 font-extrabold mt-2 text-base">R$ ${produto.preco.toFixed(2).replace('.', ',')}</p>
                        </div>
                        <button onclick="toggleAdicionais('${idUnico}')" class="bg-purple-50 text-purple-600 font-bold px-5 py-2.5 rounded-2xl hover:bg-purple-600 hover:text-white transition-all shadow-sm shrink-0">
                            + Adicionar
                        </button>
                    </div>

                    ${checkboxesHtml ? `
                        <div id="${idUnico}-adicionais" class="hidden mt-4 pt-4 border-t border-slate-100">
                            <p class="text-xs font-bold text-slate-500 mb-2 uppercase">Adicionais</p>
                            ${checkboxesHtml}
                            <button onclick="confirmarAdicaoComExtras('${idUnico}', ${produto.preco})" class="w-full mt-3 bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-2xl transition-all text-sm">
                                Adicionar ao carrinho
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Mostra/esconde a lista de adicionais de um lanche específico
        function toggleAdicionais(idUnico) {
            const painel = document.getElementById(`${idUnico}-adicionais`);
            if (painel) {
                painel.classList.toggle('hidden');
            } else {
                // Produto sem adicionais (ex: bebida) - adiciona direto ao carrinho
                const precoBase = parseFloat(document.querySelector(`#${idUnico} .text-purple-600`).innerText.replace('R$ ', '').replace(',', '.'));
                adicionarItem(precoBase);
            }
        }

        // Soma o preço base do lanche com os adicionais marcados e adiciona ao carrinho
        function confirmarAdicaoComExtras(idUnico, precoBase) {
            const painel = document.getElementById(`${idUnico}-adicionais`);
            const checkboxesMarcados = painel.querySelectorAll('.checkbox-adicional:checked');

            let precoTotal = precoBase;
            checkboxesMarcados.forEach(checkbox => {
                precoTotal += parseFloat(checkbox.dataset.preco);
            });

            adicionarItem(precoTotal);

            // Desmarca os checkboxes e fecha o painel para o próximo pedido
            painel.querySelectorAll('.checkbox-adicional').forEach(cb => cb.checked = false);
            painel.classList.add('hidden');
        }

        function adicionarItem(precoItem) {
            total += precoItem;
            document.getElementById('total-carrinho').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        // Função para zerar o carrinho
        function limparCarrinho() {
            if (total === 0) return;
            total = 0;
            document.getElementById('total-carrinho').innerText = "R$ 0,00";
        }

        async function enviarPedido() {
            if (total === 0) {
                alert("Adicione algum lanche antes de finalizar!");
                return;
            }

            const nomeCliente = prompt("Qual o seu nome?");
            if (!nomeCliente) return;

            const resposta = await fetch('http://localhost:3000/api/pedidos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cliente: nomeCliente,
                    total: total
                })
            });

            if (resposta.ok) {
                alert(`Pedido enviado com sucesso, ${nomeCliente}! A cozinha já está preparando.`);
                limparCarrinho();
            } else {
                alert("Erro ao enviar o pedido.");
            }
        }

        iniciar();
    </script>
</body>
</html>
